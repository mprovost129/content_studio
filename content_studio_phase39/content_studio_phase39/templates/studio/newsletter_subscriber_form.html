{% extends "base.html" %}
{% block title %}Edit Subscriber{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">AUDIENCE</span><h1>Edit subscriber</h1><p>Update status, source information, or private notes.</p></div><div class="heading-actions"><a class="btn btn-secondary" href="{% url 'studio:newsletter-subscriber-list' %}">Back to subscribers</a></div></div>
<section class="panel form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="heading-actions"><button class="btn btn-primary" type="submit">Save subscriber</button></div>
    </form>
</section>
{% endblock %}
