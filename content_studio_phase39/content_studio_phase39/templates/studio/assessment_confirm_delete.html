{% extends "base.html" %}
{% block title %}Delete item{% endblock %}
{% block content %}
<section class="panel delete-panel">
    <span class="eyebrow">Confirm delete</span>
    <h1>Delete this item?</h1>
    <p>This removes it from the studio and the public lesson page.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Delete</button>
        {% if object.lesson %}
            <a class="btn btn-secondary" href="{{ object.lesson.get_absolute_url }}#assessments">Cancel</a>
        {% else %}
            <a class="btn btn-secondary" href="{{ object.question.lesson.get_absolute_url }}#assessments">Cancel</a>
        {% endif %}
    </form>
</section>
{% endblock %}
