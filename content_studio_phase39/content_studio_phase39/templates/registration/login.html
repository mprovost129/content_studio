{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<section class="auth-shell"><div class="auth-card"><span class="eyebrow">PRIVATE WORKSPACE</span><h1>Sign in</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Open the studio</button></form><p><a href="{% url 'password_reset' %}">Forgot your password?</a></p></div></section>
{% endblock %}
