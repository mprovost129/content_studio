{% extends "base.html" %}
{% block title %}Edit {{ captiondraft.get_platform_display }} caption{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <span class="eyebrow">{{ captiondraft.get_platform_display }}</span>
        <h1>Edit caption draft</h1>
        <p>{{ captiondraft.lesson.title }}</p>
    </div>
</div>
<section class="panel form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save caption</button>
            <a class="btn btn-secondary" href="{{ captiondraft.lesson.get_absolute_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
